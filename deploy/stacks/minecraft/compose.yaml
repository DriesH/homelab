name: minecraft

services:
  mc:
    # Paper and Minecraft 26.1 and newer need Java 25.
    image: itzg/minecraft-server:java25
    container_name: mc
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      # The newest stable Paper. A restart downloads a newer one when it comes out.
      VERSION: LATEST
      MEMORY: ${MEMORY}
      USE_AIKAR_FLAGS: "true"
      TZ: ${TZ}
      MOTD: ${MOTD}
      DIFFICULTY: ${DIFFICULTY}
      MODE: ${GAME_MODE}
      MAX_PLAYERS: ${MAX_PLAYERS}
      VIEW_DISTANCE: ${VIEW_DISTANCE}
      SEED: ${SEED}
      # The first start makes whitelist.json and ops.json. After that the
      # server keeps them, and Homelab changes them with commands.
      WHITELIST: ${WHITELIST}
      OPS: ${OPS}
      EXISTING_WHITELIST_FILE: SKIP
      EXISTING_OPS_FILE: SKIP
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # A fixed password, so commands keep working after a restart.
      RCON_PASSWORD: ${RCON_PASSWORD}
      # Lets players with a newer Minecraft join while Paper catches up.
      MODRINTH_PROJECTS: viaversion
    volumes:
      - /opt/minecraft/data:/data
    # The server saves the world before it stops, which can take up to a minute.
    stop_grace_period: 2m

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    restart: unless-stopped
    # The tunnel goes to localhost:25565.
    network_mode: host
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY}
    # Only with a playit.gg secret key, see COMPOSE_PROFILES in .env.
    profiles: [playit]
